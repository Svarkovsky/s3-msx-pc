<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 42" width="100%" height="42" style="image-rendering: pixelated;">
  <g>
    <animateTransform attributeName="transform" 
                      type="translate" 
                      from="-32 0" to="832 0" 
                      dur="15s" 
                      repeatCount="indefinite" />
                      
    <g transform="translate(32, 0) scale(-1, 1)">
      <svg x="0" y="0" width="32" height="42" viewBox="0 0 16 21">
        <image xlink:href="data:image/png;base64," 
               href="data:image/png;base64," 
               width="240" height="21" x="0" y="0">
          <animate attributeName="x" 
                   values="0;-16;-32;-48" 
                   dur="0.6s" 
                   repeatCount="indefinite" 
                   calcMode="discrete" />
        </image>
      </svg>
    </g>
  </g>
</svg>
